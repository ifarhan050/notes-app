<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f0f2f5;
      --card:       #ffffff;
      --text:       #1a1a2e;
      --text-muted: #6b7280;
      --border:     #e5e7eb;
      --input-bg:   #ffffff;
      --shadow:     rgba(0,0,0,0.08);
    }

    [data-theme="dark"] {
      --bg:         #0f0f17;
      --card:       #1c1c2e;
      --text:       #e2e8f0;
      --text-muted: #94a3b8;
      --border:     #2d2d44;
      --input-bg:   #16162a;
      --shadow:     rgba(0,0,0,0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 2rem 1rem;
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    .header-content {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .btn {
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-theme {
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      padding: 0.35rem 0.65rem;
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .btn-theme:hover {
      color: var(--text);
      border-color: var(--text-muted);
      background: var(--card);
    }

    .btn-danger {
      background: transparent;
      color: #ef4444;
      border: 1.5px solid #fca5a5;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
    }

    .btn-danger:hover { background: #fff1f2; }

    .btn-add {
      background: #6366f1;
      color: #fff;
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1.5rem;
      line-height: 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-add:hover { opacity: 0.88; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }

    .search {
      flex: 1;
      padding: 0.55rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s;
    }

    .search:focus { border-color: #6366f1; }

    .count {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* tag filter bar */
    .tag-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
      min-height: 0;
    }

    .tag-filter:empty { display: none; }

    /* tag chips (filter bar + note cards) */
    .note-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    .tag {
      background: #eef2ff;
      color: #4338ca;
      border-radius: 999px;
      padding: 0.1rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .tag:hover { background: #e0e7ff; }
    .tag.active { background: #6366f1; color: #fff; }

    [data-theme="dark"] .tag { background: #2d2d6e; color: #a5b4fc; }
    [data-theme="dark"] .tag:hover { background: #3d3d8e; }
    [data-theme="dark"] .tag.active { background: #6366f1; color: #fff; }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .note-card {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      box-shadow: 0 1px 4px var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-left: 4px solid #6366f1;
      animation: fadeIn 0.2s ease;
      transition: background 0.2s, box-shadow 0.2s;
    }

    [data-theme="dark"] .note-card {
      border-left-color: #818cf8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      border: none;
      border-bottom: 1.5px solid transparent;
      border-radius: 4px 4px 0 0;
      padding: 0.15rem 0.25rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      width: 100%;
      background: transparent;
      color: var(--text);
      transition: border-color 0.2s, background 0.15s;
    }

    .card-title:focus {
      border-bottom-color: #6366f1;
      background: #f5f5ff;
    }

    [data-theme="dark"] .card-title:focus {
      background: #1e1e3a;
    }

    .card-body {
      border: none;
      border-radius: 4px;
      padding: 0.15rem 0.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      outline: none;
      width: 100%;
      background: transparent;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      transition: background 0.15s;
    }

    .card-body:focus {
      background: #f5f5ff;
    }

    [data-theme="dark"] .card-body:focus {
      background: #1e1e3a;
    }

    .card-tags {
      border: none;
      border-radius: 4px;
      padding: 0.15rem 0.25rem;
      font-size: 0.8rem;
      font-family: inherit;
      background: transparent;
      color: var(--text-muted);
      outline: none;
      width: 100%;
      transition: background 0.15s;
    }

    .card-tags:focus { background: #f5f5ff; }
    [data-theme="dark"] .card-tags:focus { background: #1e1e3a; }
    .card-tags::placeholder { opacity: 0.55; }

    .note-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .note-footer {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      padding-top: 0.25rem;
      border-top: 1px solid var(--border);
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e3a;
      color: #e2e8f0;
      padding: 0.65rem 1rem 0.65rem 1.2rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      animation: toastIn 0.2s ease;
      white-space: nowrap;
    }

    .toast.hiding { animation: toastOut 0.2s ease forwards; }

    .btn-undo {
      background: transparent;
      color: #a5b4fc;
      border: 1.5px solid #4f46e5;
      padding: 0.25rem 0.65rem;
      font-size: 0.8rem;
    }

    .btn-undo:hover { background: rgba(99,102,241,0.2); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(-50%) translateY(0); }
      to   { opacity: 0; transform: translateX(-50%) translateY(10px); }
    .error-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: #fef2f2;
      color: #991b1b;
      border: 1.5px solid #fca5a5;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    [data-theme="dark"] .error-banner {
      background: #2d1b1b;
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    .error-banner__msg { flex: 1; }

    .error-banner__dismiss {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      color: inherit;
      opacity: 0.7;
      padding: 0 0.2rem;
      flex-shrink: 0;
    }

    .error-banner__dismiss:hover { opacity: 1; }

    .loading-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .spinner {
      display: inline-block;
      width: 2rem;
      height: 2rem;
      border: 3px solid var(--border);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="errorBanner" class="error-banner" hidden>
      <span class="error-banner__msg" id="errorBannerMsg"></span>
      <button class="error-banner__dismiss" onclick="dismissErrorBanner()" title="Dismiss" aria-label="Dismiss error">✕</button>
    </div>

    <header>
      <div class="header-content">
        <div>
          <h1>Notes</h1>
          <p>Capture your thoughts, fast.</p>
        </div>
        <button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">☽</button>
      </div>
    </header>

    <div class="toolbar">
      <input class="search" id="searchInput" type="search" placeholder="Search notes..." oninput="renderNotes()" />
      <button class="btn btn-add" onclick="addNote()" title="New note">+</button>
      <span class="count" id="countLabel"></span>
    </div>

    <div class="tag-filter" id="tagFilter"></div>

    <div class="notes-grid" id="notesGrid"></div>
  </div>

  <script>
    let notes = [];
    let loading = true;
    let activeTag = null;
    const _debounceTimers = {};

    function debounce(key, fn, delay) {
      clearTimeout(_debounceTimers[key]);
      _debounceTimers[key] = setTimeout(fn, delay);
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function escJs(str) {
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function showErrorBanner(msg) {
      const banner = document.getElementById('errorBanner');
      document.getElementById('errorBannerMsg').textContent = msg;
      banner.hidden = false;
    }

    function dismissErrorBanner() {
      document.getElementById('errorBanner').hidden = true;
    }

    async function loadNotes() {
      try {
        const res = await fetch('/api/notes');
        notes = await res.json();
      } catch {
        notes = [];
        showErrorBanner('Could not connect to server. Please ensure the app is running.');
      }
      } catch { notes = []; }
      loading = false;
      renderNotes();
    }

    async function addNote() {
      const id = Date.now();
      const note = { id, title: '', body: '', tags: [], created_at: id, updated_at: id };
      notes.unshift(note);
      renderNotes();
      const card = document.querySelector(`.note-card[data-id="${id}"]`);
      if (card) card.querySelector('.card-title').focus();
      fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(note)
      }).catch(() => {});
    }

    function updateNoteField(id, field, value) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      note[field] = value;
      note.updated_at = Date.now();
      const card = document.querySelector(`.note-card[data-id="${id}"]`);
      if (card) {
        const meta = card.querySelector('.note-meta');
        if (meta) meta.textContent = formatDate(note.updated_at);
      }
      debounce(`field-${id}`, () =>
        fetch(`/api/notes/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: note.title, body: note.body, updated_at: note.updated_at })
        }).catch(() => {}), 600);
    }

    function updateNoteTags(id, value) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      note.tags = value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
      note.updated_at = Date.now();
      renderNotes();
      fetch(`/api/notes/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tags: note.tags, updated_at: note.updated_at })
      }).catch(() => {});
    }

    let _pendingDelete = null;

    function deleteNote(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      const noteIndex = notes.indexOf(note);
      if (_pendingDelete) {
        clearTimeout(_pendingDelete.timer);
        fetch(`/api/notes/${_pendingDelete.id}`, { method: 'DELETE' }).catch(() => {});
        _pendingDelete = null;
        _removeToast();
      }
      notes = notes.filter(n => n.id !== id);
      renderNotes();
      _showUndoToast();
      const timer = setTimeout(() => {
        fetch(`/api/notes/${id}`, { method: 'DELETE' }).catch(() => {});
        _hideToast();
        _pendingDelete = null;
      }, 5000);
      _pendingDelete = { id, note, noteIndex, timer };
    }

    function undoDelete() {
      if (!_pendingDelete) return;
      clearTimeout(_pendingDelete.timer);
      const { note, noteIndex } = _pendingDelete;
      _pendingDelete = null;
      notes.splice(noteIndex, 0, note);
      renderNotes();
      _hideToast();
      fetch(`/api/notes/${note.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: note.title, body: note.body, tags: note.tags, updated_at: note.updated_at })
      }).catch(() => {});
    }

    function _showUndoToast() {
      _removeToast();
      const el = document.createElement('div');
      el.id = 'undoToast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      el.innerHTML = '<span>Note deleted</span><button class="btn btn-undo" onclick="undoDelete()">Undo</button>';
      document.body.appendChild(el);
    }

    function _removeToast() {
      const el = document.getElementById('undoToast');
      if (el) el.remove();
    }

    function _hideToast() {
      const el = document.getElementById('undoToast');
      if (!el) return;
      el.classList.add('hiding');
      setTimeout(() => el.remove(), 200);
    }

    function setTagFilter(tag) {
      activeTag = activeTag === tag ? null : tag;
      renderNotes();
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderTagFilter() {
      const allTags = [...new Set(notes.flatMap(n => n.tags))].sort();
      const bar = document.getElementById('tagFilter');
      if (!bar) return;
      if (activeTag && !allTags.includes(activeTag)) activeTag = null;
      bar.innerHTML = allTags.map(t =>
        `<span class="tag${t === activeTag ? ' active' : ''}" onclick="setTagFilter('${escJs(t)}')">${escHtml(t)}</span>`
      ).join('');
    }

    function renderNotes() {
      renderTagFilter();

      const query    = document.getElementById('searchInput').value.toLowerCase();
      const grid     = document.getElementById('notesGrid');
      const filtered = notes.filter(n => {
        const matchesSearch = n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query);
        const matchesTag    = !activeTag || n.tags.includes(activeTag);
        return matchesSearch && matchesTag;
      });

      document.getElementById('countLabel').textContent =
        filtered.length === 0 ? '' : `${filtered.length} note${filtered.length !== 1 ? 's' : ''}`;

      if (loading) {
        grid.innerHTML = `<div class="loading-state">
          <div class="spinner"></div>
          <div>Loading notes…</div>
        </div>`;
        return;
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <div class="icon">📝</div>
          <div>${query || activeTag ? 'No matching notes.' : 'Click + to add your first note!'}</div>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map(n => {
        const tagChips = n.tags.map(t =>
          `<span class="tag${t === activeTag ? ' active' : ''}" onclick="setTagFilter('${escJs(t)}')">${escHtml(t)}</span>`
        ).join('');
        return `
        <div class="note-card" data-id="${n.id}">
          <input class="card-title" value="${escHtml(n.title)}" placeholder="Title" maxlength="80"
                 oninput="updateNoteField(${n.id}, 'title', this.value)" />
          <textarea class="card-body" placeholder="Write your note here..."
                    oninput="updateNoteField(${n.id}, 'body', this.value)">${escHtml(n.body)}</textarea>
          <input class="card-tags" value="${escHtml(n.tags.join(', '))}" placeholder="Tags (comma-separated, e.g. work, ideas)"
                 onchange="updateNoteTags(${n.id}, this.value)" />
          ${tagChips ? `<div class="note-tags">${tagChips}</div>` : ''}
          <div class="note-meta">${formatDate(n.updated_at)}</div>
          <div class="note-footer">
            <button class="btn btn-danger" onclick="deleteNote(${n.id})">Delete</button>
          </div>
        </div>`;
      }).join('');
    }

    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('notes-theme', next); } catch { /* quota exceeded */ }
      document.getElementById('themeBtn').textContent = next === 'dark' ? '☀' : '☽';
    }

    // Initialise theme before first paint
    let _saved = null;
    try { _saved = localStorage.getItem('notes-theme'); } catch { /* storage unavailable */ }
    const _preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = _saved ?? _preferred;
    document.getElementById('themeBtn').textContent =
      document.documentElement.dataset.theme === 'dark' ? '☀' : '☽';

    loadNotes();
  </script>
</body>
</html>
